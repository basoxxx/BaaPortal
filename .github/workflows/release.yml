name: Release

# Costruisce gli installatori (Windows .exe, macOS .dmg arm64 e x64) e li allega alla release
# di GitHub del tag. Parte da sola quando si pubblica una release; a mano (workflow_dispatch) per
# allegarli a una release già esistente.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag della release (es. v0.7.0)
        required: true

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Allega gli installatori alla release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/dist/*.exe apps/desktop/dist/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "nessun installatore" >&2; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber
