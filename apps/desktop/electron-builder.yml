appId: it.baaportal.app
productName: BaaPortal
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/@serialport/bindings-cpp/prebuilds/{android,linux}-*/**'
# serialport usa binari N-API precompilati (prebuilds/): niente ricompilazione, e i .node stanno fuori dall'asar.
npmRebuild: false
asarUnpack:
  - '**/*.node'
publish:
  provider: github
  owner: basoxxx
  repo: BaaPortal
fileAssociations:
  - ext: baap
    name: Progetto BaaPortal
    role: Editor
win:
  files:
    - '!**/@serialport/bindings-cpp/prebuilds/darwin-*/**'
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  files:
    - '!**/@serialport/bindings-cpp/prebuilds/win32-*/**'
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  extendInfo:
    NSLocalNetworkUsageDescription: BaaPortal si collega ai PLC della rete locale per leggerne i dati.
